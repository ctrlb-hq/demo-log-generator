[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         dummy
    Tag          waf
    Rate         500
    Dummy        {"timestamp":"2024-01-01T12:00:00Z","src_ip":"203.0.113.45","dst_ip":"10.0.0.5","method":"POST","uri":"/api/login","status":403,"action":"BLOCK","rule_id":"942100","rule_msg":"SQL Injection Attack Detected","user_agent":"Mozilla/5.0 (X11; Linux x86_64)","country":"IN","bytes":1247,"latency_ms":42}

[OUTPUT]
    Name                   s3
    Match                  *
    bucket                 new-ingester
    region                 auto
    endpoint               https://storage.googleapis.com
    total_file_size        1M
    upload_timeout         30s
    use_put_object         On
    compression            gzip
    s3_key_format          /waf-test-dummy/%Y/%m/%d/%H/%M/%S-$UUID.gz
    store_dir              /tmp/fluent-bit/s3-buffer
    json_date_key          false