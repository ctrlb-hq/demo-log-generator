[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name              http
    Listen            0.0.0.0
    Port              8888
    Tag               waf
    buffer_max_size   32M
    buffer_chunk_size 1M

[OUTPUT]
    Name                   s3
    Match                  *
    bucket                 new-ingester
    region                 auto
    endpoint               https://storage.googleapis.com
    total_file_size        1M
    upload_timeout         30s
    use_put_object         On
    compression            gzip
    s3_key_format          /waf-test/%Y/%m/%d/%H/%M/%S-$UUID.gz
    store_dir              /tmp/fluent-bit/s3-buffer
    json_date_key          false