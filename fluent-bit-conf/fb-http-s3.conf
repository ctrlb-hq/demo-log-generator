[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name              http
    Listen            0.0.0.0
    Port              8089
    Tag               waf
    buffer_max_size   32M
    buffer_chunk_size 1M

[OUTPUT]
    Name                     s3
    Match                    *
    bucket                   new-ingester
    region                   asia-south1
    endpoint                 https://storage.googleapis.com
    total_file_size          5M
    upload_timeout           10s
    use_put_object           On
    workers                  1
    preserve_data_ordering   false
    compression              gzip
    s3_key_format            /waf_stream_01/%Y/%m/%d/%H/%M-%S-$UUID.gz
    store_dir                /tmp/fluent-bit/s3-buffer
    json_date_key            false
    retry_limit              15
    net.tcp_keepalive            on
    net.tcp_keepalive_time       30
    net.tcp_keepalive_interval   10
    net.tcp_keepalive_probes     3
    net.keepalive_max_recycle    10
    net.io_timeout               5s
    auto_retry_requests          true